name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: dragonfly, POSTGRES_PASSWORD: dragonfly, POSTGRES_DB: dragonfly }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U dragonfly" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - run: ruff check .
      - name: Migrations apply on Postgres
        run: alembic upgrade head
        env: { DATABASE_URL: "postgresql+psycopg://dragonfly:dragonfly@localhost:5432/dragonfly" }
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q && docker compose build
